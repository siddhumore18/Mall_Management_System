name: 🚀 Deploy MegaMart to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  BACKEND_IMAGE: megamart-backend
  FRONTEND_IMAGE: megamart-frontend

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Build & Test Backend
  # ─────────────────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Test Backend (Java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test -B --no-transfer-progress
        working-directory: ./backend

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Build & Push Docker Images to ECR
  # ─────────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test-backend
    outputs:
      backend_tag: ${{ steps.meta.outputs.backend_tag }}
      frontend_tag: ${{ steps.meta.outputs.frontend_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "backend_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "frontend_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Tag: ${SHORT_SHA}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Backend image
        run: |
          TAG="${{ steps.meta.outputs.backend_tag }}"
          docker build -t $ECR_REGISTRY/$BACKEND_IMAGE:$TAG -t $ECR_REGISTRY/$BACKEND_IMAGE:latest ./backend
          docker push $ECR_REGISTRY/$BACKEND_IMAGE:$TAG
          docker push $ECR_REGISTRY/$BACKEND_IMAGE:latest

      - name: Build & push Frontend image
        run: |
          TAG="${{ steps.meta.outputs.frontend_tag }}"
          docker build -t $ECR_REGISTRY/$FRONTEND_IMAGE:$TAG -t $ECR_REGISTRY/$FRONTEND_IMAGE:latest ./frontend
          docker push $ECR_REGISTRY/$FRONTEND_IMAGE:$TAG
          docker push $ECR_REGISTRY/$FRONTEND_IMAGE:latest

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Deploy to EC2 via SSH
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 300s
          script: |
            set -e
            echo "=== MegaMart Deployment Started ==="
            
            # AWS ECR login on the EC2 server
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            
            # Navigate to app directory
            cd /opt/megamart
            
            # Pull latest images
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/megamart-backend:latest
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/megamart-frontend:latest
            
            # Zero-downtime restart
            docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans
            
            # Clean up old images
            docker image prune -f
            
            echo "=== Deployment Complete ==="
            docker compose -f docker-compose.prod.yml ps
