version: '3.8'

services:
  megamart-postgres:
    image: postgres:16-alpine
    container_name: megamart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: megamartdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - megamart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d megamartdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  megamart_pgdata:
    driver: local
